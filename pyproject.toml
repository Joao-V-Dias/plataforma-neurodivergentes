[project]
name = "plataforma-neurodivergentes"
version = "0.1.0"
description = "Plataforma de Educacao Adaptativa em Programacao para Pessoas Neurodivergentes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    "pydantic[email]>=2.9.0",
    "groq>=0.13.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: `Depends(...)` como valor padrao de argumento e o padrao idiomatico
# do FastAPI para injecao de dependencia, nao um bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Migrations sao geradas pelo `alembic revision --autogenerate` e nao devem
# ser reformatadas manualmente; linhas longas de op.create_table/index sao
# normais e preservam a saida padrao da ferramenta.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Necessario porque app/core/database.py cria uma unica engine assincrona a
# nivel de modulo: as conexoes do pool ficam presas ao event loop em que
# foram abertas, entao todos os testes precisam compartilhar o mesmo loop
# (senao "Event loop is closed" ao reusar uma conexao em outro teste).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
# 80% no geral (Parte 8) - a suite real fica em ~94%; o teto nao chega a
# 100% de proposito, porque nao vale a pena testar o corpo da chamada real
# ao SDK da Groq (app/ai/groq_client.py) so para inflar numero - isso
# custaria dinheiro e seria nao-deterministico (ver app/tests/test_dicas.py).
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
